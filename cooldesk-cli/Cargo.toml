[package]
name = "cooldesk-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.8", features = ["derive", "env"] }
clap_complete = "4"
dirs = "5"
serde_json = "1.0.154"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
ureq = { version = "2", default-features = false, features = ["json"] }
